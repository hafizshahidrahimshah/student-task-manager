<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Task Manager</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <h1>Student Task Manager</h1>
    <p>Plan your study work and keep track of what is done.</p>
  </header>

  <main class="container">
    <section class="card">
      <h2>Add a New Task</h2>
      <form id="task-form" class="task-form">
        <label for="task-title">Task Title</label>
        <input type="text" id="task-title" placeholder="e.g. Finish Computer Vision lab report" required>

        <label for="task-desc">Description</label>
        <textarea id="task-desc" rows="3" placeholder="Short details about the task"></textarea>

        <button type="submit" class="btn btn-primary">Add Task</button>
      </form>
    </section>

    <section class="card">
      <h2>My Tasks</h2>
      <ul id="task-list" class="task-list"></ul>
      <p id="empty-message" class="empty">No tasks yet.</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
